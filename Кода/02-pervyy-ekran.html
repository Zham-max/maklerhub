<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Inter:wght@400&display=swap">
<style>
/* site-reset */
.mhh-root, .mhh-root * { box-sizing: border-box; }
.mhh-root img { border: 0 !important; box-shadow: none !important; max-width: 100%; }
.mhh-root h1, .mhh-root h2, .mhh-root h3 { border: 0; padding: 0; background: none; text-decoration: none; color: inherit; }
.mhh-root p { margin: 0; }
.mhh-root a { text-decoration: none; }
.mhh-root {
  --bg: #ffffff;
  --ink: #141414;
  --body: #5b5a56;
  --bronze: #b67233;
  --teal: #025f6b;
  --display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --label: var(--display);
  color-scheme: light;
}
.mhh-root { background: var(--bg); color: var(--ink); font-family: var(--display); }
.mhh-root .mhh-hero {
  max-width: 1200px; margin: 0 auto;
  padding-block: 32px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: 40px; align-items: center;
}
.mhh-root .mhh-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 440px; }
.mhh-root .mhh-eyebrow { margin: 0; color: var(--bronze); font-weight: 700; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; line-height: 1.6; max-width: 400px; }
.mhh-root h1 { margin: 0; font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.18;
  text-transform: uppercase; text-wrap: balance; }
.mhh-root .mhh-bar { width: 56px; height: 4px; background: var(--bronze); margin-top: 2px; }
.mhh-root .mhh-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.mhh-root .mhh-btn { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 12px;
  font: 700 15px/1 var(--display); text-decoration: none; transition: background-color .2s ease, color .2s ease; }
.mhh-root .mhh-btn.mhh-fill { background: var(--bronze); color: #fff; }
.mhh-root .mhh-btn.mhh-fill:hover { background: #9d5f27; }
.mhh-root .mhh-btn.mhh-ghost { border: 1.5px solid var(--teal); color: var(--teal); }
.mhh-root .mhh-btn.mhh-ghost:hover { background: var(--teal); color: #fff; }
.mhh-root .mhh-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.mhh-root .mhh-lead { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; line-height: 1.6;
  color: var(--body); max-width: 420px; }
.mhh-root .mhh-art { min-width: 0; width: 100%; max-width: 600px; justify-self: end; align-self: center; }
.mhh-root .mhh-copy { align-self: center; }
/* видео вместо анимации логотипа */
.mhh-root .mhh-frame { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; background: #efe7dc;
  box-shadow: 0 30px 60px -30px rgba(1,76,86,.45), 0 0 0 1px rgba(1,76,86,.06); }
.mhh-root .mhh-frame video { display: block; width: 100%; height: 100%; object-fit: cover; }
.mhh-root .mhh-sound { position: absolute; right: 14px; top: 14px; appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 11px; border-radius: 999px;
  background: rgba(1,76,86,.88); color: #fff; font: 700 13px/1 var(--display); transition: background-color .2s ease; }
.mhh-root .mhh-sound:hover { background: #014c56; }
.mhh-root .mhh-sound:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }
.mhh-root .mhh-sound svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mhh-root .mhh-sound[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
.mhh-root .mhh-art { animation: mhh-slideIn 1.1s cubic-bezier(.2,.7,.2,1) .15s both; }
}
@keyframes mhh-slideIn { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
@media (max-width: 560px) {
.mhh-root .mhh-frame { border-radius: 14px; }
.mhh-root .mhh-sound { right: 10px; top: 10px; width: 38px; padding: 0; justify-content: center; }
.mhh-root .mhh-st { display: none; }
}
@media (max-width: 760px) {
.mhh-root .mhh-hero { grid-template-columns: 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }

}

</style>
<div class="mhh-root">

<section class="mhh-hero">
  <div class="mhh-copy">
    <p class="mhh-eyebrow">— Всё для агента по недвижимости — в одном месте</p>
    <h1>Все риелторы.<br>Все новостройки.<br>Одна платформа.</h1>
    <div class="mhh-bar" aria-hidden="true"></div>
    <p class="mhh-lead">Маклер.Хаб объединяет риелторов и застройщиков на платформе RedCat.</p>
    <div class="mhh-btns">
      <a class="mhh-btn mhh-fill" href="#b455">Я риелтор <span aria-hidden="true">→</span></a>
      <a class="mhh-btn mhh-ghost" href="#b459">Я застройщик <span aria-hidden="true">→</span></a>
    </div>
  </div>
  <div class="mhh-art" id="mhh-art">
    <div class="mhh-frame">
      <video id="mhh-video" src="media/maklerhub.mp4" poster="media/maklerhub.jpg" autoplay muted loop playsinline preload="auto"
        aria-label="Видео: каждый ЖК — отдельный поиск; с Маклер.Хаб все ЖК на одной платформе RedCat"></video>
      <button class="mhh-sound" id="mhh-sound" type="button" aria-label="Смотреть со звуком">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
        <span class="mhh-st">Смотреть со звуком</span>
      </button>
    </div>
  </div>
</section>
</div>
<script>
(function () {
  var v = document.getElementById('mhh-video');
  var btn = document.getElementById('mhh-sound');
  if (!v || !btn) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { v.removeAttribute('autoplay'); v.pause(); v.controls = true; }
  // без звука крутится по кругу; кнопка перезапускает ролик со звуком с начала
  btn.addEventListener('click', function () {
    v.muted = false; v.loop = false; v.controls = true; v.currentTime = 0;
    v.play().catch(function () {});
  });
  v.addEventListener('volumechange', function () { btn.hidden = !v.muted; });
  // пауза, когда первый экран прокрутили; без звука — снова играет при возврате
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) v.pause();
        else if (v.paused && v.muted && v.hasAttribute('autoplay')) v.play().catch(function () {});
      });
    }, { threshold: 0.2 }).observe(v);
  }
})();
</script>
