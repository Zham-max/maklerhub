<style>
/* site-reset */
.mhh-root, .mhh-root * { box-sizing: border-box; }
.mhh-root img { border: 0 !important; box-shadow: none !important; max-width: 100%; }
.mhh-root h1, .mhh-root h2, .mhh-root h3 { border: 0; padding: 0; background: none; text-decoration: none; color: inherit; }
.mhh-root p { margin: 0; }
.mhh-root a { text-decoration: none; }
.mhh-root {
  --bg: #ffffff;
  --ink: #0b0b0b;
  --body: #1d1d1d;
  --bronze: #b67233;
  --teal: #015e6b;
  --display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --label: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
.mhh-root { background: var(--bg); color: var(--ink); font-family: var(--display); }
.mhh-root .mhh-hero {
  max-width: 1200px; margin: 0 auto;
  padding-block: 32px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: 40px; align-items: center;
}
.mhh-root .mhh-copy { display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 440px; }
.mhh-root .mhh-eyebrow { margin: 0; color: var(--bronze); font-weight: 700; font-size: 13px;
  letter-spacing: .06em; text-transform: uppercase; line-height: 1.5; max-width: 400px; }
.mhh-root h1 { margin: 0; font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.5;
  text-transform: uppercase; text-wrap: balance; }
.mhh-root .mhh-bar { width: 70px; height: 10px; background: var(--bronze); margin-top: 12px; }
.mhh-root .mhh-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.mhh-root .mhh-btn { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px; border-radius: 12px;
  font: 700 15px/1 var(--display); text-decoration: none; transition: background-color .2s ease, color .2s ease; }
.mhh-root .mhh-btn.mhh-fill { background: var(--bronze); color: #fff; }
.mhh-root .mhh-btn.mhh-fill:hover { background: #9d5f27; }
.mhh-root .mhh-btn.mhh-ghost { border: 1.5px solid var(--teal); color: var(--teal); }
.mhh-root .mhh-btn.mhh-ghost:hover { background: var(--teal); color: #fff; }
.mhh-root .mhh-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.mhh-root .mhh-lead { margin: 0; font-family: var(--display); font-weight: 400; font-size: 14px; line-height: 1.8;
  color: var(--body); max-width: 420px; }
.mhh-root .mhh-art { min-width: 0; width: 100%; max-width: 600px; justify-self: end; align-self: center; }
.mhh-root .mhh-copy { align-self: center; }
.mhh-root .mhh-art svg { display: block; width: 100%; height: auto; overflow: visible; }
.mhh-root .mhh-line { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.mhh-root .mhh-dot { fill: var(--teal); }
.mhh-root .mhh-word { fill: var(--teal); font-family: var(--label); font-size: 23.8px; }
@media (prefers-reduced-motion: no-preference) {
.mhh-root .mhh-art { animation: mhh-slideIn 1.1s cubic-bezier(.2,.7,.2,1) .15s both; }
.mhh-root .mhh-line { stroke-dasharray: 1; animation: mhh-draw 1.1s ease-in-out both; }
.mhh-root .mhh-l0 { animation-delay: .7s; }
.mhh-root .mhh-l2 { animation-delay: 1.6s; }
.mhh-root .mhh-l1 { animation-delay: 2.5s; }
.mhh-root .mhh-l3 { animation-delay: 3.4s; }
.mhh-root .mhh-dot, .mhh-root .mhh-word { animation: mhh-pop .5s ease-out both; transform-box: fill-box; transform-origin: center; }
.mhh-root .mhh-d0, .mhh-root .mhh-w0 { animation-delay: 1.6s; }
.mhh-root .mhh-d1, .mhh-root .mhh-w1 { animation-delay: 2.5s; }
.mhh-root .mhh-d2, .mhh-root .mhh-w2 { animation-delay: 3.4s; }
.mhh-root .mhh-d3, .mhh-root .mhh-w3 { animation-delay: 4.4s; }

}
@keyframes mhh-slideInLeft { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: none; } }
@keyframes mhh-slideIn { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
@keyframes mhh-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes mhh-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
.mhh-root .mhh-replay { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 600 13px var(--label); color: var(--teal); background: var(--bg); border: 1.5px solid var(--teal);
  padding: 8px 14px; cursor: pointer; }
.mhh-root .mhh-replay:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
@media (max-width: 760px) {
.mhh-root .mhh-hero { grid-template-columns: 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }

}

</style>
