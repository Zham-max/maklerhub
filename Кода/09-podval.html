<style>
/* site-reset */
.mhft-root, .mhft-root * { box-sizing: border-box; }
.mhft-root img { border: 0 !important; box-shadow: none !important; max-width: 100%; }
.mhft-root h1, .mhft-root h2, .mhft-root h3 { border: 0; padding: 0; background: none; text-decoration: none; color: inherit; }
.mhft-root p { margin: 0; }
.mhft-root a { text-decoration: none; }
.mhft-root {
  --bg: #ffffff; --ink: #141414; --muted: #555555; --line: #e7e2dc;
  --teal: #025f6b; --teal-deep: #014c56; --sand: #da9858; --bronze: #b67233; --rc: #f54012;
  --mint: #eaf3f4; --cream: #f7efe5;
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
.mhft-root { font-family: var(--font); color: var(--ink); }
.mhft-root .mhft-wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; box-sizing: border-box; }
.mhft-root .mhft-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 22px;
  border-radius: 12px; font: 700 15px/1 var(--font); text-decoration: none; white-space: nowrap; box-sizing: border-box;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
.mhft-root .mhft-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.mhft-root .mhft-btn .mhft-arr { transition: transform .2s ease; }
.mhft-root .mhft-btn:hover .mhft-arr { transform: translateX(3px); }
.mhft-root .mhft-ftr { background: #1d2a2c; color: #d9e4e5; }
.mhft-root .mhft-top { padding-top: 48px; padding-bottom: 32px; display: grid; grid-template-columns: 1fr 220px 280px; gap: 32px; }
.mhft-root .mhft-top img { display: block; height: 70px; width: auto; }
.mhft-root .mhft-slogan { margin: 12px 0 0; color: var(--sand); font-weight: 600; }
.mhft-root .mhft-col { display: flex; flex-direction: column; gap: 9px; font-size: 14.5px; }
.mhft-root .mhft-col b { color: #fff; margin-bottom: 4px; }
.mhft-root .mhft-col a { color: #d9e4e5; text-decoration: none; }
.mhft-root .mhft-col a:hover { color: var(--sand); }
.mhft-root .mhft-legal { border-top: 1px solid rgba(255,255,255,.15); padding-top: 18px; padding-bottom: 28px; font-size: 13px; color: #9fb3b5;
  display: flex; gap: 10px 22px; flex-wrap: wrap; }
.mhft-root .mhft-legal a { color: var(--sand); }
@media (max-width: 760px) {
.mhft-root .mhft-top { grid-template-columns: 1fr; }
 }

</style>
