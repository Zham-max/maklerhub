<style>
/* site-reset */
.mhhd-root, .mhhd-root * { box-sizing: border-box; }
.mhhd-root img { border: 0 !important; box-shadow: none !important; max-width: 100%; }
.mhhd-root h1, .mhhd-root h2, .mhhd-root h3 { border: 0; padding: 0; background: none; text-decoration: none; color: inherit; }
.mhhd-root p { margin: 0; }
.mhhd-root a { text-decoration: none; }
.mhhd-root {
  --bg: #ffffff; --ink: #141414; --muted: #555555; --line: #e7e2dc;
  --teal: #025f6b; --teal-deep: #014c56; --sand: #da9858; --bronze: #b67233; --rc: #f54012;
  --mint: #eaf3f4; --cream: #f7efe5;
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
}
.mhhd-root { font-family: var(--font); color: var(--ink); }
.mhhd-root .mhhd-wrap { max-width: 1200px; margin: 0 auto; padding-left: 24px; padding-right: 24px; box-sizing: border-box; }
.mhhd-root .mhhd-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 22px;
  border-radius: 12px; font: 700 15px/1 var(--font); text-decoration: none; white-space: nowrap; box-sizing: border-box;
  transition: background-color .2s ease, color .2s ease, border-color .2s ease; }
.mhhd-root .mhhd-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.mhhd-root .mhhd-btn .mhhd-arr { transition: transform .2s ease; }
.mhhd-root .mhhd-btn:hover .mhhd-arr { transform: translateX(3px); }
.mhhd-root .mhhd-hdr { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
.mhhd-root .mhhd-bar { display: flex; align-items: center; gap: 28px; height: 76px; }
.mhhd-root .mhhd-logo img { display: block; height: 42px; width: auto; }
.mhhd-root .mhhd-nav { display: flex; gap: 22px; }
.mhhd-root .mhhd-nav a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.mhhd-root .mhhd-nav a:hover { color: var(--teal); }
.mhhd-root .mhhd-right { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.mhhd-root .mhhd-tel { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; white-space: nowrap; }
.mhhd-root .mhhd-rc img { display: block; height: 26px; width: auto; }
.mhhd-root .mhhd-burger { display: none; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
.mhhd-root .mhhd-burger span { display: block; width: 20px; height: 2px; background: var(--ink); margin: 4px auto; }
.mhhd-root .mhhd-panel { display: none; }
@media (max-width: 1000px) {
.mhhd-root .mhhd-nav { display: none; }
.mhhd-root .mhhd-burger { display: block; }
.mhhd-root .mhhd-tel { display: none; }
.mhhd-root .mhhd-panel.mhhd-open { display: flex; flex-direction: column; gap: 4px; padding: 8px 24px 18px; border-top: 1px solid var(--line); }
.mhhd-root .mhhd-panel a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 16px; padding: 10px 0; }
.mhhd-root .mhhd-panel .mhhd-ptel { color: var(--teal); font-weight: 700; }

}
@media (max-width: 480px) {
.mhhd-root .mhhd-logo img { height: 34px; }
.mhhd-root .mhhd-rc img { height: 20px; }
.mhhd-root .mhhd-bar { gap: 14px; height: 64px; }
 }

</style>
